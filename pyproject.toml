[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rulesnap"
version = "0.1.0"
description = "Capture and semantically diff GitHub repository rulesets."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rulesnap contributors" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rulesnap = "rulesnap.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/rulesnap"]

[tool.hatch.build.targets.sdist]
exclude = ["/.tmp"]
